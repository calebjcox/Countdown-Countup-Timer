name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # Platform packages carry a minor version now: there is no "android-37",
      # only android-37.0 / 37.1 / 37.2. compileSdk = 37 resolves to android-37.0.
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        run: |
          echo "APP_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :core:test

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      # No signing keystore configured yet, so this is an unsigned release
      # build. Wire up a signingConfig (reading from secrets) once one exists.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release-unsigned.apk
          generate_release_notes: true
