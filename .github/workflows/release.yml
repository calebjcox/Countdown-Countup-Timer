name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    # Job-wide rather than on the build step alone: lintRelease compiles the release
    # variant too, so it passes through the same signing config and needs the same
    # key. build.yml deliberately gets none of these — debug signs with the committed
    # debug.keystore and must keep working for anyone who forks this repo.
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - uses: actions/checkout@v4

      # Kept in step with build.yml, which needs 21 for the Robolectric test in the
      # unit-test suite this workflow also runs. Two workflows on two JDKs is a way
      # for a release to fail on something the build already proved.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      # Platform packages carry a minor version now: there is no "android-37",
      # only android-37.0 / 37.1 / 37.2. compileSdk = 37 resolves to android-37.0.
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # versionCode comes from the tag, not from a run counter. Play requires it to
      # increase strictly and forever, and burns every value it has seen — while
      # github.run_number is scoped to this workflow *file* and silently restarts at
      # 1 if the file is ever renamed or replaced, which would be unrecoverable.
      # v1.2.3 -> 10203. Monotonic exactly while minor and patch stay below 100,
      # hence the guard.
      - name: Compute version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          # 10# forces base 10. Without it a tag like v1.2.08 makes bash read "08"
          # as octal, which is not an arithmetic error it exits on — it prints a
          # complaint, leaves APP_VERSION_CODE unset, and the build quietly falls
          # back to versionCode 1.
          major="$(( 10#${BASH_REMATCH[1]} ))"
          minor="$(( 10#${BASH_REMATCH[2]} ))"
          patch="$(( 10#${BASH_REMATCH[3]} ))"
          if (( minor > 99 || patch > 99 )); then
            echo "::error::minor and patch must be below 100 to keep versionCode monotonic"
            exit 1
          fi
          echo "APP_VERSION_CODE=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$version" >> "$GITHUB_ENV"

      # Both suites, not just :core:test. The backup format is the only copy of a
      # timer a user may have kept for years, and until now the checks covering it
      # ran on every push to main but not on the path that actually reaches people.
      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintRelease

      # An AAB, not an APK: Play has required App Bundles for new apps since 2021,
      # and there is no longer anything that consumes a release APK here. Signed with
      # the upload key from the secrets above — see "Releasing" in the README.
      - name: Build release bundle
        run: ./gradlew :app:bundleRelease

      # Checked before the upload rather than left to Google's 400, because the two
      # failures below arrive there as "invalid_grant" and "Invalid JWT", neither of
      # which points at the secret that is actually wrong. stderr is dropped so a
      # malformed value cannot spill a private key fragment into the log.
      - name: Check Play credentials
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is unset or empty. It holds a Play" \
                 "Console service-account key, in full — see \"Releasing\" in the README."
            exit 1
          fi
          if ! jq -e 'has("client_email") and has("private_key")' \
               <<< "$PLAY_SERVICE_ACCOUNT_JSON" > /dev/null 2>&1; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not a service-account key: it is" \
                 "either not JSON or has no client_email/private_key. Paste the whole" \
                 ".json file Google Cloud downloads, not a fragment of it."
            exit 1
          fi

      # Ahead of the GitHub Release on purpose. A release here is the record that a
      # version reached people, so it is created only once Play has taken the bundle
      # — a versionCode Play has already burned, or a key whose permissions were
      # revoked, leaves the tag with no release attached and the run red, which is
      # what actually happened.
      #
      # The track is a repository variable so that widening the audience is a
      # settings change and not a commit: set PLAY_TRACK to "production" and the same
      # tag push that ships to testers ships to everyone. "alpha" is the API's name
      # for the built-in closed testing track; a custom closed track goes by the
      # track name Play shows on its own page.
      - name: Upload to Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.calebjcox.countdownwidgets
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          # Names the release in the Play Console after the tag rather than the
          # versionCode, so 1.2.3 there matches v1.2.3 here.
          releaseName: ${{ env.APP_VERSION_NAME }}
          track: ${{ vars.PLAY_TRACK || 'alpha' }}
          # The whole track at once. A staged percentage rollout would be "inProgress"
          # with a userFraction, which only makes sense once the track is production.
          status: completed
          # Play refuses to send changes for review through the API while an app has
          # never been published, and the upload fails outright rather than falling
          # back. Setting the PLAY_CHANGES_NOT_SENT_FOR_REVIEW repository variable to
          # "true" uploads the bundle and leaves it for a human to submit in the
          # console; clear it once the app has a published release.
          changesNotSentForReview: ${{ vars.PLAY_CHANGES_NOT_SENT_FOR_REVIEW == 'true' }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          fail_on_unmatched_files: true
