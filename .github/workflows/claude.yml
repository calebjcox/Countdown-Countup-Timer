name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Three gates.
    #
    # The comment author keeps this to your own mentions.
    #
    # The body check is startsWith rather than contains, which matches how the
    # trigger is used — leading the comment — and not how it is discussed. A
    # substring test passes on any comment that merely quotes the phrase inside
    # backticks or quotes, which then starts a runner, fails the action's own word
    # boundary regex and stops. Every comment about these two files is that shape,
    # so the loose test would be wrong here more often than anywhere else in the
    # repo.
    #
    # No trailing space in the prefix. The action accepts any of [\s.,!?;:] after
    # the phrase, or end of string — its regex is
    # (^|\s)@claude([\s.,!?;:]|$) — so requiring a space here would silently
    # drop "@claude: do this", "@claude, please", and a bare "@claude". Silently
    # is the problem: a gate that fails the if starts no job at all, so there is
    # nothing in the Actions tab to notice.
    #
    # What is given up is a mid-comment mention the action would have accepted.
    # Lead with the mention and it runs, punctuation or not.
    #
    # The third is the one that does not read as obvious: gating who may *speak*
    # does not gate what Claude then *reads*. A stranger's pull request or issue —
    # its body, its later comments, its diff — becomes the context of any run you
    # start by commenting on it, and this job holds contents, pull-requests and
    # issues write plus git push. So the thread's author has to be you as well.
    # issue.user covers issue_comment and pull_request.user covers
    # pull_request_review_comment; the other is null on each event, hence the or.
    if: >-
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '@claude') &&
      (github.event.issue.user.login == github.repository_owner ||
      github.event.pull_request.user.login == github.repository_owner)

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # Lets Claude read the Build workflow's results, so "@claude why is CI red"
      # can be answered from the logs rather than guessed at.
      actions: read

    steps:
      # Full history, for the reason claude-code-review.yml states: CLAUDE.md puts
      # a change's reasoning in its commit message and expects git log -S and git
      # blame to reach it. A hand-asked pass answering "what is this line for" or
      # "was that comment filed anywhere" needs the same history the automatic one
      # gets, and a shallow checkout leaves it nothing to read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No prompt input. That is necessary for tag mode, where Claude waits for a
      # real mention instead of running something fixed, but not sufficient on its
      # own: the action reaches tag mode only when the trigger regex also matches,
      # and otherwise falls through to agent mode, which without a prompt has
      # nothing to run and exits. Either way nothing happens without a mention. A
      # prompt here would turn this into an automation firing on every comment the
      # if lets through.
      #
      # What that makes a hand-asked review: an ad-hoc pass written into a single
      # tracking comment. Not the review claude-code-review.yml runs — that one is
      # the code-review plugin posting inline findings, and this job installs no
      # plugins and allows no inline-comment tool.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
